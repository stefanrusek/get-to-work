<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Get To Work</title>
	<link rel="stylesheet" href="index.css" />
</head>
<body>
	<main id="alert" class="alert">
		<div class="eyebrow" id="eyebrow">Upcoming meeting</div>
		<h1 class="title" id="title">Loading…</h1>
		<div class="when" id="when"></div>
		<div class="countdown" id="countdown"></div>
		<div class="location" id="location"></div>
		<div class="actions">
			<button id="join" class="btn primary" hidden>Join <kbd>J</kbd></button>
			<button id="snooze1" class="btn">Snooze 1m <kbd>1</kbd></button>
			<button id="snooze5" class="btn">Snooze 5m <kbd>5</kbd></button>
			<button id="dismiss" class="btn">Dismiss <kbd>Esc</kbd></button>
		</div>
		<div class="footer">
			<button id="customize" class="link">Customize this event…</button>
		</div>
	</main>
	<script type="module" src="index.js"></script>
</body>
</html>
